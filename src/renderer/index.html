<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Win11Opti</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:">
<link rel="stylesheet" href="styles.css"></head>
<body>
<header><div><h1>Win11Opti</h1><p id="tagline"></p></div>
 <select id="lang"><option value="en">English</option><option value="es">Español</option></select></header>
<main>
 <section id="left">
  <div id="profiles"></div>
  <div id="list"></div>
 </section>
 <aside>
  <div id="vSel">
   <h3 id="tDur"></h3>
   <select id="hours"></select>
   <p class="mu" id="selCount"></p>
   <button class="btn" id="go"></button>
   <details id="autoBox"><summary id="tAuto"></summary>
    <p class="mu" id="autoHelp"></p>
    <input id="games" placeholder="game1.exe, game2.exe">
    <button class="btn alt" id="autoOn"></button>
   </details>
  </div>
  <div id="vAct" hidden>
   <h3 id="aTitle"></h3>
   <div class="ring"><svg width="150" height="150"><circle cx="75" cy="75" r="66" class="bg"/><circle id="arc" cx="75" cy="75" r="66" class="fg"/></svg><div><span id="cd"></span><small id="cdl"></small></div></div>
   <ul id="done"></ul>
   <button class="btn rs" id="rs"></button>
   <button class="btn alt" id="autoOff" hidden></button>
  </div>
 </aside>
</main>
<footer><span id="ver"></span><label><input type="checkbox" id="upd"> <span id="tUpd"></span></label></footer>
<div id="modal" hidden><div class="box"><h2 id="mT"></h2><ul id="mL"></ul><label class="chk"><input type="checkbox" id="mOk"> <span id="mC"></span></label>
 <div class="btns"><button class="btn alt" id="mNo"></button><button class="btn" id="mYes" disabled></button></div></div></div>
<script src="strings.js"></script><script src="renderer.js"></script>
</body></html>
